name: Actualizar estadísticas

on:
  schedule:
    - cron: "17 6 * * *" # todos los días, 01:17 hora de Lima
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar tarjetas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: FabioOC01
          GITHUB_EXTRA_USERS: OrlandoOchoa
        run: python -I scripts/generate_stats.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          if git diff --cached --quiet; then
            echo "Sin cambios en las estadísticas."
          else
            git commit -m "Actualizar estadísticas"
            git push
          fi
